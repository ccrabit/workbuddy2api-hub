name: Sync from upstream

# Pulls the upstream project into this fork once a day, and turns every new
# state of it into a built .fpk.
#
#   * fast-forward or clean auto-merge  -> pushed to this fork, the new state is
#     tagged v<upstream release>.<commits since it>, and the package is built
#     and attached to a release of that tag;
#   * merge conflict -> aborted (no half-merged repository), an issue is opened
#     or updated, the conflicted files and the merge commands go into the run
#     summary, and the run fails so the failure is visible in the Actions list
#     as well - including when Issues are switched off and no issue can exist.
#
# The tag carries a fourth component because upstream tags a release days after
# the commits that make it: "v1.6.10.7" says "upstream v1.6.10 plus the seven
# commits we have on top". fnOS only offers an upgrade for a bigger number, and
# scripts/build-fpk.sh derives the same number, so a tag and the package built
# from it agree - provided the checkout can see an upstream release tag at all.
# A fresh CI checkout of this fork sees the fork's own remote only, which is how
# the release tag v1.6.17.1 once built a package called 1.6.10.3. Two things
# keep that from happening again: this workflow mirrors upstream's release tags
# to origin on every run, and build-fpk.yml hands the pushed tag down as VERSION
# instead of leaving the version to a derivation.
#
# The conflict path below opens or comments on an issue, and it fails the run
# either way. These are two independent signals on purpose: a conflict has to be
# loud even when the issue cannot be written. Issues have to be enabled on this
# repository (Settings -> General -> Features -> Issues) for the issue half to
# work - without them `gh issue create` fails with "Resource not accessible by
# integration (createIssue)" - so the step checks `has_issues` first, falls back
# to an ::error:: annotation plus the run summary (with the conflicted files and
# the merge commands), and only then exits non-zero.
#
# This fork is not a mirror: the default branch also carries the fnOS layer
# (fnos/**, the gateway changes in wb_proxy.py and dashboard.html, the packaging
# scripts). Upstream touching those files therefore conflicts, and a conflict is
# never resolved here - the merge is aborted, nothing half-merged is pushed, an
# issue is opened or updated, and the run fails so it shows up in the Actions
# list. A human decides which side wins; upstream-first is the standing rule.
on:
  schedule:
    # 03:17 UTC, i.e. 11:17 in Asia/Shanghai.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  UPSTREAM_REPO: ardeyouxipianyi/workbuddy2api-hub
  UPSTREAM_BRANCH: main
  CONFLICT_TITLE: Upstream sync needs a human

jobs:
  sync:
    name: merge upstream
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          set -e
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" 2>/dev/null \
            || git remote set-url upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --tags --prune upstream
          echo "upstream $(git rev-parse --short "upstream/${UPSTREAM_BRANCH}")"

      # Mirror upstream tags to origin: this fork's version scheme asks "what is
      # the newest upstream release tag this checkout can see", and a fresh CI
      # checkout sees this fork's remote only. Every upstream release tag is
      # mirrored, not just the newest one, and on every run - including the runs
      # where there is nothing to merge, which is exactly when the fork's tags
      # can fall behind without anyone noticing.
      # A tag pushed with GITHUB_TOKEN does not start a workflow run, so these
      # tag pushes are only something to look at; the package job below is the
      # explicit `uses:` call.
      - name: Mirror upstream tags
        run: |
          set -e
          mirrored=0
          for upstream_tag in $(git tag --merged "upstream/${UPSTREAM_BRANCH}" --list 'v*' \
            | grep -E '^v[0-9]+(\.[0-9]+){2}$' | sort -V); do
            if git ls-remote --exit-code --tags origin "refs/tags/${upstream_tag}" > /dev/null 2>&1; then
              continue
            fi
            git push origin "refs/tags/${upstream_tag}"
            echo "mirrored upstream tag ${upstream_tag}"
            mirrored=$((mirrored + 1))
          done
          echo "${mirrored} upstream tag(s) mirrored to origin"

      - name: Merge upstream
        id: merge
        run: |
          set -e
          upstream_ref="upstream/${UPSTREAM_BRANCH}"
          branch="${{ github.event.repository.default_branch }}"

          behind="$(git rev-list --count "HEAD..${upstream_ref}")"
          if [ "$behind" = "0" ]; then
            echo "already up to date with ${upstream_ref}"
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git merge --no-edit "$upstream_ref"; then
            git push origin "HEAD:${branch}"
            echo "merged=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Upstream merged"
              echo
              echo "${behind} commit(s) from \`${upstream_ref}\` are now on \`${branch}\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            # Read the conflicted paths before aborting: `Report a conflict` runs
            # in a later step, where the working tree is clean again and there is
            # nothing left to list.
            conflicted="$(git diff --name-only --diff-filter=U | tr '\n' ' ' | sed 's/ *$//')"
            git merge --abort
            echo "merged=false" >> "$GITHUB_OUTPUT"
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            echo "conflicted=${conflicted}" >> "$GITHUB_OUTPUT"
            echo "Merging ${upstream_ref} conflicted; the merge was aborted."
            echo "conflicted paths: ${conflicted:-<none reported>}"
          fi

      - name: Report a conflict
        if: steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CONFLICTED: ${{ steps.merge.outputs.conflicted }}
        run: |
          set -e
          branch="${{ github.event.repository.default_branch }}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="$(cat <<EOF
          Merging \`upstream/${UPSTREAM_BRANCH}\` into \`${branch}\` failed, so the sync stopped and
          the merge was aborted - this fork is still exactly where it was.

          Conflicted files:

          \`\`\`
          ${CONFLICTED:-<none reported>}
          \`\`\`

          Resolve it by hand:

          \`\`\`bash
          git remote add upstream https://github.com/${UPSTREAM_REPO}.git  # once
          git fetch upstream
          git checkout ${branch}
          git merge upstream/${UPSTREAM_BRANCH}       # fix the conflicts
          git push origin ${branch}
          \`\`\`

          Run: ${run_url}
          EOF
          )"

          # The issue is the durable half of "fail loudly"; the red run is the
          # other half, and it must not depend on the issue. Issues can be
          # switched off on the repository, and then `gh issue create` fails with
          # "Resource not accessible by integration (createIssue)" - three
          # scheduled runs did exactly that and left no trace but a red run. So:
          # try the issue when it is possible, and always report loudly.
          issues="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .has_issues 2>/dev/null || echo unknown)"
          if [ "$issues" = "true" ]; then
            number="$(gh issue list --state open --search "in:title \"${CONFLICT_TITLE}\"" \
              --json number --jq '.[0].number // empty' | head -1)"
            if [ -n "$number" ]; then
              gh issue comment "$number" --body "$body" || issues="failed"
            else
              gh issue create --title "${CONFLICT_TITLE}" --body "$body" || issues="failed"
            fi
          fi

          if [ "$issues" != "true" ]; then
            if [ "$issues" = "failed" ]; then
              why="Opening or updating the issue failed (Resource not accessible by integration), so the detail is in this run's summary instead."
            else
              why="This repository has Issues disabled (Settings -> General -> Features -> Issues), so no issue was opened. Enabling them is all it takes: this step opens or updates the issue by itself once they are on."
            fi
            echo "::error::${CONFLICT_TITLE}: ${why}"
            {
              echo "### Upstream sync blocked by a merge conflict"
              echo
              echo "${why}"
              echo
              echo "Conflicted files:"
              echo
              echo '```'
              echo "${CONFLICTED:-<none reported>}"
              echo '```'
              echo
              echo "Resolve it by hand:"
              echo
              echo '```bash'
              echo "git remote add upstream https://github.com/${UPSTREAM_REPO}.git  # once"
              echo "git fetch upstream"
              echo "git checkout ${branch}"
              echo "git merge upstream/${UPSTREAM_BRANCH}       # fix the conflicts"
              echo "git push origin ${branch}"
              echo '```'
              echo
              echo "Run: ${run_url}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          exit 1

      - name: Tag this state as a release
        id: release
        run: |
          set -e
          upstream_ref="upstream/${UPSTREAM_BRANCH}"

          # The newest upstream release tag, not simply the newest tag: this
          # fork's own releases have a fourth component and would sort above
          # every upstream tag, and only upstream/main's tags are upstream's.
          tag="$(git tag --merged "$upstream_ref" --list 'v*' \
            | grep -E '^v[0-9]+(\.[0-9]+){2}$' | sort -V | tail -1 || true)"
          if [ -z "$tag" ]; then
            echo "upstream has not tagged a release yet - nothing to name a version after"
            exit 0
          fi

          # Upstream's release tags were already mirrored to origin right after
          # the fetch, so the tag below is visible to anyone who checks this fork
          # out - see the "Mirror upstream tags" step.
          # What this exact tree would be built as - the same number the tag
          # gets, so the release, the tag and the fpk all carry one version.
          version="$(bash scripts/build-fpk.sh --print-version)"
          ours="v${version}"
          echo "this state is ${ours} (upstream ${tag})"

          if git rev-parse -q --verify "refs/tags/${ours}" > /dev/null \
            || git ls-remote --exit-code --tags origin "refs/tags/${ours}" > /dev/null 2>&1; then
            echo "${ours} has already been released"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${ours}" -m "WorkBuddy2API-Hub ${version} (upstream ${tag})"
          git push origin "refs/tags/${ours}"
          echo "tag=${ours}" >> "$GITHUB_OUTPUT"
          echo "releasing ${ours}, built from $(git rev-parse --short HEAD)"

  package:
    name: build the new release
    needs: sync
    if: needs.sync.outputs.tag != ''
    # Called explicitly rather than left to the tag push: a tag pushed with
    # GITHUB_TOKEN does not start a workflow run. The called workflow publishes
    # the release itself, so it needs to be able to write to this repository.
    permissions:
      contents: write
    uses: ./.github/workflows/build-fpk.yml
    with:
      ref: ${{ needs.sync.outputs.tag }}
