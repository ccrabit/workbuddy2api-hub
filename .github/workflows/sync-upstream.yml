name: Sync from upstream

# Pulls the upstream project into this fork three times a day, and turns a new
# upstream release into a built .fpk.
#
#   * fast-forward or clean auto-merge  -> pushed to this fork. If upstream has
#     released a version this fork has not published yet, that state is tagged
#     fnos-X.Y.Z and the package is built and attached to a release of that tag;
#     otherwise the branch simply moves and nothing is published;
#   * merge conflict -> aborted (no half-merged repository), the conflicted state
#     is also pushed as a sync-conflict/<date> branch so it can be resolved
#     without reproducing the merge by hand, an issue is opened or updated when
#     the repository has Issues enabled, the conflicted files and the merge
#     commands go into the run summary, and the run fails so the failure is
#     visible in the Actions list as well - including when Issues are switched
#     off and no issue can exist.
#
# The version is upstream's own number, three components, nothing added:
# fnos-1.6.19 means "the release upstream called v1.6.19". fnOS compares numbers,
# so a bigger number now means exactly one thing - upstream released something
# newer - and commits upstream merged after its last release do not move it.
# Those commits are what the *next* upstream release will contain; naming a build
# after them would publish a number upstream never released.
#
# Releases are tagged fnos-X.Y.Z rather than vX.Y.Z on purpose. Upstream ships
# .github/workflows/release.yml, which runs on `push: tags: ["v*"]` and opens a
# draft release, so a "v*" tag of ours would set that off inside this fork; and
# because both namespaces are refs/tags, pushing upstream's tags here would also
# mean a later fetch of upstream moves whichever tag it saw last. Nothing in this
# workflow writes to upstream's namespace: what this fork knows about upstream
# releases is asked of the upstream remote directly, at the moment it is needed.
#
# The conflict path below opens or comments on an issue, and it fails the run
# either way. These are two independent signals on purpose: a conflict has to be
# loud even when the issue cannot be written. Issues have to be enabled on this
# repository (Settings -> General -> Features -> Issues) for the issue half to
# work - without them `gh issue create` fails with "Resource not accessible by
# integration (createIssue)" - so the step checks `has_issues` first, falls back
# to an ::error:: annotation plus the run summary (with the conflicted files and
# the merge commands), and only then exits non-zero.
#
# This fork is not a mirror: the default branch also carries the fnOS layer
# (fnos/**, the gateway changes in wb_proxy.py and dashboard.html, the packaging
# scripts). Upstream touching those files therefore conflicts, and a conflict is
# never resolved here - the merge is aborted, nothing half-merged is pushed, an
# issue is opened or updated, and the run fails so it shows up in the Actions
# list. A human decides which side wins; upstream-first is the standing rule.
on:
  schedule:
    # Three attempts a day, six hours apart: 11:17, 17:23 and 23:41 in
    # Asia/Shanghai. The GitHub scheduler delays and sometimes drops scheduled
    # runs under load (this one has run hours late), so one slot a day is one
    # chance a day. The job is idempotent - a fork that is already up to date
    # merges nothing and publishes nothing - so repeats cost a checkout.
    - cron: "17 3 * * *"
    - cron: "23 9 * * *"
    - cron: "41 15 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  UPSTREAM_REPO: ardeyouxipianyi/workbuddy2api-hub
  UPSTREAM_BRANCH: main
  CONFLICT_TITLE: Upstream sync needs a human

jobs:
  sync:
    name: merge upstream
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          set -e
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" 2>/dev/null \
            || git remote set-url upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --tags --prune upstream
          echo "upstream $(git rev-parse --short "upstream/${UPSTREAM_BRANCH}")"

      # Upstream's release tags are deliberately NOT pushed to origin: upstream's
      # release.yml fires on `push: tags: ["v*"]`, and those tags would live in
      # the same refs/tags namespace that a later `git fetch upstream` writes to.
      # Everything that needs to know which upstream release this is asks the
      # upstream remote instead. This fetch is what makes the answer available
      # locally to the steps below.

      - name: Merge upstream
        id: merge
        run: |
          set -e
          upstream_ref="upstream/${UPSTREAM_BRANCH}"
          branch="${{ github.event.repository.default_branch }}"

          behind="$(git rev-list --count "HEAD..${upstream_ref}")"
          if [ "$behind" = "0" ]; then
            echo "already up to date with ${upstream_ref}"
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git merge --no-edit "$upstream_ref"; then
            git push origin "HEAD:${branch}"
            echo "merged=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Upstream merged"
              echo
              echo "${behind} commit(s) from \`${upstream_ref}\` are now on \`${branch}\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            # Read the conflicted paths before touching the index: `Report a
            # conflict` runs in a later step, where the working tree is clean
            # again and there is nothing left to list.
            conflicted="$(git diff --name-only --diff-filter=U | tr '\n' ' ' | sed 's/ *$//')"
            echo "Merging ${upstream_ref} conflicted."
            echo "conflicted paths: ${conflicted:-<none reported>}"

            # Keep the merge Git just made: resolving it needs exactly this
            # state, and reproducing it by hand takes the same fetch plus the same
            # resolution decisions. Committing while the conflicts are still in
            # the files - which is what `git add -A` stages - is what makes the
            # branch useful; it is a place to finish the merge, never something to
            # merge back on its own. One branch per UTC day, so a second conflict
            # the same day replaces the first instead of piling up.
            conflict_branch="sync-conflict/$(date -u +%Y-%m-%d)"
            if git add -A \
              && git commit --no-edit -m "conflicted merge of ${upstream_ref} (conflict markers kept)" \
              && git push --force origin "HEAD:refs/heads/${conflict_branch}"; then
              echo "conflict_branch=${conflict_branch}" >> "$GITHUB_OUTPUT"
              echo "conflicted state pushed as ${conflict_branch}"
            else
              echo "conflict_branch=" >> "$GITHUB_OUTPUT"
              echo "::warning::could not push the conflicted state as ${conflict_branch}; the merge has to be reproduced locally (see the summary below)"
            fi

            git merge --abort 2>/dev/null || true
            echo "merged=false" >> "$GITHUB_OUTPUT"
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            echo "conflicted=${conflicted}" >> "$GITHUB_OUTPUT"
          fi

      - name: Report a conflict
        if: steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CONFLICTED: ${{ steps.merge.outputs.conflicted }}
          CONFLICT_BRANCH: ${{ steps.merge.outputs.conflict_branch }}
        run: |
          set -e
          branch="${{ github.event.repository.default_branch }}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          # How to pick this up depends on whether the conflicted state made it
          # onto the fork, which the merge step reports.
          if [ -n "${CONFLICT_BRANCH}" ]; then
            note="The conflicted merge is on \`${CONFLICT_BRANCH}\`, conflict markers and all: check it out, fix the files, and bring the result into \`${branch}\`."
            cmds="$(printf '%s\n' \
              'git fetch origin' \
              "git checkout ${CONFLICT_BRANCH}     # the conflict markers are in the files" \
              '# edit the conflicted files, then mark each one resolved:' \
              'git add <file>' \
              'git commit --no-edit' \
              "git checkout ${branch}" \
              "git merge ${CONFLICT_BRANCH}" \
              "git push origin ${branch}")"
          else
            note="The conflicted state could not be pushed, so the merge has to be reproduced locally."
            cmds="$(printf '%s\n' \
              "git remote add upstream https://github.com/${UPSTREAM_REPO}.git  # once" \
              'git fetch upstream' \
              "git checkout ${branch}" \
              "git merge upstream/${UPSTREAM_BRANCH}       # fix the conflicts" \
              "git push origin ${branch}")"
          fi

          body="$(cat <<EOF
          Merging \`upstream/${UPSTREAM_BRANCH}\` into \`${branch}\` failed, so the sync stopped and
          the merge was aborted - this fork is still exactly where it was.

          Conflicted files:

          \`\`\`
          ${CONFLICTED:-<none reported>}
          \`\`\`

          ${note}

          \`\`\`bash
          ${cmds}
          \`\`\`

          Run: ${run_url}
          EOF
          )"

          # The issue is the durable half of "fail loudly"; the red run is the
          # other half, and it must not depend on the issue. Issues can be
          # switched off on the repository, and then `gh issue create` fails with
          # "Resource not accessible by integration (createIssue)" - three
          # scheduled runs did exactly that and left no trace but a red run. So:
          # try the issue when it is possible, and always report loudly.
          issues="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .has_issues 2>/dev/null || echo unknown)"
          if [ "$issues" = "true" ]; then
            number="$(gh issue list --state open --search "in:title \"${CONFLICT_TITLE}\"" \
              --json number --jq '.[0].number // empty' | head -1)"
            if [ -n "$number" ]; then
              gh issue comment "$number" --body "$body" || issues="failed"
            else
              gh issue create --title "${CONFLICT_TITLE}" --body "$body" || issues="failed"
            fi
          fi

          if [ "$issues" != "true" ]; then
            if [ "$issues" = "failed" ]; then
              why="Opening or updating the issue failed (Resource not accessible by integration), so the detail is in this run's summary instead."
            else
              why="This repository has Issues disabled (Settings -> General -> Features -> Issues), so no issue was opened. Enabling them is all it takes: this step opens or updates the issue by itself once they are on."
            fi
            echo "::error::${CONFLICT_TITLE}: ${why}"
            {
              echo "### Upstream sync blocked by a merge conflict"
              echo
              echo "${why}"
              echo
              echo "Conflicted files:"
              echo
              echo '```'
              echo "${CONFLICTED:-<none reported>}"
              echo '```'
              echo
              echo "${note}"
              echo
              echo '```bash'
              printf '%s\n' "${cmds}"
              echo '```'
              echo
              echo "Run: ${run_url}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          exit 1

      - name: Tag this state as a release
        id: release
        run: |
          set -e
          upstream_ref="upstream/${UPSTREAM_BRANCH}"

          # The newest upstream release tag, not simply the newest tag: only
          # upstream/main's tags are upstream's, and this fork's fnos-* tags are
          # about our releases, not theirs.
          upstream_tag="$(git tag --merged "$upstream_ref" --list 'v*' \
            | grep -E '^v[0-9]+(\.[0-9]+){2}$' | sort -V | tail -1 || true)"
          if [ -z "$upstream_tag" ]; then
            echo "upstream has not tagged a release yet - nothing to name a version after"
            exit 0
          fi
          version="${upstream_tag#v}"

          # What we have already published, read from origin rather than from
          # this checkout's tags, so it says the same thing on a fresh clone.
          published="$(git ls-remote --tags --refs origin 2>/dev/null \
            | awk '{print $2}' | sed 's#^refs/tags/fnos-##' \
            | grep -E '^[0-9]+(\.[0-9]+){2}$' | sort -V | tail -1 || true)"
          echo "upstream released ${version}; we last released ${published:-<nothing>}"

          # Publish a new version, and only a new one: upstream's release is what
          # a version number promises. Everything else this workflow merges -
          # commits upstream added after its last release, our own earlier
          # release, a push from a human - moves the branch without naming a new
          # version, because fnOS would not offer a package with a version the
          # device already has.
          if [ -n "$published" ]; then
            newest="$(printf '%s\n%s\n' "$version" "$published" | sort -V | tail -1)"
            if [ "$newest" = "$published" ]; then
              echo "upstream's newest release (${version}) is not newer than what we published (${published}) - nothing to publish"
              exit 0
            fi
          fi

          ours="fnos-${version}"
          if git rev-parse -q --verify "refs/tags/${ours}" > /dev/null \
            || git ls-remote --exit-code --tags origin "refs/tags/${ours}" > /dev/null 2>&1; then
            echo "${ours} has already been released"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${ours}" -m "WorkBuddy2API-Hub ${version} (upstream ${upstream_tag})"
          git push origin "refs/tags/${ours}"
          echo "tag=${ours}" >> "$GITHUB_OUTPUT"
          echo "releasing ${ours}, built from $(git rev-parse --short HEAD)"

  package:
    name: build the new release
    needs: sync
    if: needs.sync.outputs.tag != ''
    # Called explicitly rather than left to the tag push: a tag pushed with
    # GITHUB_TOKEN does not start a workflow run. The called workflow publishes
    # the release itself, so it needs to be able to write to this repository.
    permissions:
      contents: write
    uses: ./.github/workflows/build-fpk.yml
    with:
      ref: ${{ needs.sync.outputs.tag }}
