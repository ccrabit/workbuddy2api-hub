name: Build the fnOS package

# Three ways in:
#   * a fnos-X.Y.Z tag pushed to this fork by hand - a release of this fork. The
#     tag IS the version, whatever tags this checkout can see (the derivation in
#     scripts/build-fpk.sh never has to guess). A historical v<version>[.<ordinal>]
#     tag still builds, so an old release can be rebuilt.
#   * the "Run workflow" button, to build a package from a branch: that only
#     produces a build artifact, never a release, and its version is a process
#     version (-alpha<k>),
#   * a `uses:` call from sync-upstream.yml, which already knows the tag.
on:
  push:
    tags: ["fnos-*", "v*"]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Tag or commit to build (empty: the ref of whoever called us)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  fpk:
    name: build and test the fpk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          # The build script may have to look for a release tag (and, when the
          # checkout has none, ask the upstream remote what the newest upstream
          # release is), so the tags and the history they sit on have to be here.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the package
        env:
          PACKAGER: ${{ github.repository_owner }}
          PACKAGER_URL: ${{ github.server_url }}/${{ github.repository }}
          # A pushed tag IS the release: hand its version down instead of letting
          # the script derive it. The two have to agree, and this step refuses to
          # publish when they do not - that check is what once caught the tag
          # v1.6.17.1 building 1.6.10.3. Empty on a branch build, where the
          # derived (process) version is the only answer there is.
          TAG_REF: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          set -e
          if [ -n "${TAG_REF}" ]; then
            case "${TAG_REF}" in
              fnos-*) expected="${TAG_REF#fnos-}" ;;
              v*)     expected="${TAG_REF#v}" ;;
              *)
                echo "::error::this workflow cannot name a release after the tag ${TAG_REF}: releases of this fork are tagged fnos-X.Y.Z"
                exit 1
                ;;
            esac
            derived="$(bash scripts/build-fpk.sh --print-version)"
            if [ "${derived}" != "${expected}" ]; then
              echo "::error::tag ${TAG_REF} asks for version ${expected}, but this tree derives ${derived} - refusing to publish a package the tag does not name"
              exit 1
            fi
            echo "tag ${TAG_REF} builds version ${expected}"
            export VERSION="${expected}"
          fi
          bash scripts/build-fpk.sh

      - name: Run the package through its lifecycle
        run: bash scripts/verify-fpk.sh

      - name: Attach the package to a release
        if: inputs.ref != '' || startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.ref || github.ref_name }}
        run: |
          set -e
          files=(dist/*.fpk dist/*.sha256)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" \
              --title "WorkBuddy2API-Hub $TAG" \
              --generate-notes
          fi

      - uses: actions/upload-artifact@v4
        with:
          # Named after the product; the package's own `appname` stays
          # workbuddy2api, which is what the device keys the install off.
          name: workbuddy2api-hub-fpk
          path: dist/*
          if-no-files-found: error
