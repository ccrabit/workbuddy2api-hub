name: Build the fnOS package

# Three ways in:
#   * a v* tag pushed to this fork by hand - a release of this fork, named
#     v<upstream release>.<commits since it> (see sync-upstream.yml),
#   * the "Run workflow" button, to build a package from a branch: that only
#     produces a build artifact, never a release,
#   * a `uses:` call from sync-upstream.yml, which already knows the tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Tag or commit to build (empty: the ref of whoever called us)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  fpk:
    name: build and test the fpk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          # The version is <latest tag>[.<commits since it>], so the tags and
          # the history between them have to be here.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the package
        env:
          PACKAGER: ${{ github.repository_owner }}
          PACKAGER_URL: ${{ github.server_url }}/${{ github.repository }}
        run: bash scripts/build-fpk.sh

      - name: Run the package through its lifecycle
        run: bash scripts/verify-fpk.sh

      - name: Attach the package to a release
        if: inputs.ref != '' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.ref || github.ref_name }}
        run: |
          set -e
          files=(dist/*.fpk dist/*.sha256)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" \
              --title "WorkBuddy2API $TAG" \
              --generate-notes
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: workbuddy2api-fpk
          path: dist/*
          if-no-files-found: error
