name: Build the fnOS package

# Three ways in:
#   * a v* tag pushed to this fork by hand - a release of this fork, named
#     v<upstream release>.<commits since it> (see sync-upstream.yml). A release
#     tag on HEAD is the version as-is, whatever tags this checkout can see.
#   * the "Run workflow" button, to build a package from a branch: that only
#     produces a build artifact, never a release,
#   * a `uses:` call from sync-upstream.yml, which already knows the tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Tag or commit to build (empty: the ref of whoever called us)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  fpk:
    name: build and test the fpk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          # The version is <latest tag>[.<commits since it>], so the tags and
          # the history between them have to be here.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the package
        env:
          PACKAGER: ${{ github.repository_owner }}
          PACKAGER_URL: ${{ github.server_url }}/${{ github.repository }}
          # A pushed tag IS the release: hand its version down instead of letting
          # the script derive it, because derivation reads the tags this checkout
          # can see and a fresh checkout of this fork may not see upstream's -
          # which is how the tag v1.6.17.1 once built 1.6.10.3. Empty on a branch
          # build, where the derived version is the only answer there is.
          TAG_REF: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          set -e
          if [ -n "${TAG_REF}" ]; then
            expected="${TAG_REF#v}"
            derived="$(bash scripts/build-fpk.sh --print-version)"
            if [ "${derived}" != "${expected}" ]; then
              echo "::error::tag ${TAG_REF} asks for version ${expected}, but this tree derives ${derived} - refusing to publish a package the tag does not name"
              exit 1
            fi
            echo "tag ${TAG_REF} builds version ${expected}"
            export VERSION="${expected}"
          fi
          bash scripts/build-fpk.sh

      - name: Run the package through its lifecycle
        run: bash scripts/verify-fpk.sh

      - name: Attach the package to a release
        if: inputs.ref != '' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.ref || github.ref_name }}
        run: |
          set -e
          files=(dist/*.fpk dist/*.sha256)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" \
              --title "WorkBuddy2API-Hub $TAG" \
              --generate-notes
          fi

      - uses: actions/upload-artifact@v4
        with:
          # Named after the product; the package's own `appname` stays
          # workbuddy2api, which is what the device keys the install off.
          name: workbuddy2api-hub-fpk
          path: dist/*
          if-no-files-found: error
